# Časolov — Cloudflare Worker (igra + API za zasebne sobe)
name = "letnica-si"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# Statične datoteke igre (index.html, app.js, …) streže isti Worker.
# Mapa public/ vsebuje samo datoteke igre.
[assets]
directory = "./public"
binding = "ASSETS"
# Skozi Worker gre le API sob; statične datoteke streže Cloudflare neposredno
# (brezplačno in brez omejitve, ne štejejo v dnevno omejitev zahtev)
run_worker_first = ["/api/*", "/arhiv", "/arhiv/*", "/sitemap.xml"]

[[d1_databases]]
binding = "DB"
database_name = "casolov"
database_id = "b42037e2-38fc-4587-af32-50b6adfbd8bf"
migrations_dir = "migrations"
